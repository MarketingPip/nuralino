name: Build and Commit WASM

on:
  push:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile*'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build WASM
        run: |
          # Replace this with your actual build command (e.g., npm run build or make -f Makefile.wasm)
          make -f Makefile.wasm

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build WASM binaries [skip ci]"
          file_pattern: "dist/*"
